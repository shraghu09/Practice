name: Deploy Angular + .NET API to EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}   # ✅ Run workflow button

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Step 2: Build Angular Frontend (auth-ui)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies & Build Angular
        working-directory: auth-ui
        run: |
          npm install
          npm run build -- --configuration production

      # ✅ Step 3: Publish .NET Backend (AuthAPI)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & Publish .NET API
        working-directory: AuthAPI
        run: |
          dotnet restore
          dotnet publish -c Release -o publish

      # ✅ Step 4: Copy Angular dist to EC2
      - name: Copy Angular build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "auth-ui/dist/**"
          target: "/var/www/authui"

      # ✅ Step 5: Copy .NET publish files to EC2
      - name: Copy .NET API publish to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "AuthAPI/publish/**"
          target: "/var/www/authapi"

      # ✅ Step 6: Restart services on EC2
      - name: Restart API and Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo systemctl restart authapi
            sudo systemctl restart nginx
            sudo systemctl status authapi --no-pager
            echo "✅ Deployment completed successfully"
