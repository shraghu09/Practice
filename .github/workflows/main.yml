name: Deploy Angular + .NET to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ✅ Build Angular Frontend
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Angular
        working-directory: auth-ui
        run: |
          npm install
          npm run build -- --configuration production

      # ✅ Build .NET Backend
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish .NET API
        working-directory: AuthAPI
        run: |
          dotnet restore
          dotnet publish -c Release -o publish

      # ✅ Copy Angular build to EC2
      - name: Copy UI to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "auth-ui/dist/**"
          target: "/var/www/authui"

      # ✅ Copy API publish to EC2
      - name: Copy API to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "AuthAPI/publish/**"
          target: "/var/www/authapi"

      # ✅ Restart API + Nginx
      - name: Restart Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo systemctl restart authapi
            sudo systemctl restart nginx
            echo "✅ Deployment Success"
